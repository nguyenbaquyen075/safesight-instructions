<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">Kiến trúc hệ thống phát hiện vi phạm YOLOv8</title>
        <desc id="archify-diagram-description">Luồng dữ liệu YOLOv8 qua HTTP, YOLO Bridge và WebSocket tới Dashboard; API lưu vi phạm qua Prisma. Chuyển động minh họa tự lặp, không phải dữ liệu trực tiếp. Tôn trọng cài đặt giảm chuyển động.</desc>
        <style>
svg{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}.c-grid{fill:none;stroke:#dbe4ee}.c-mask{fill:#f8fafc}.c-backend{fill:#eef2ff;stroke:#6366f1}.c-frontend{fill:#e0f2fe;stroke:#0284c7}.c-database{fill:#ecfdf5;stroke:#059669}.t-primary{fill:#0f172a}.t-muted{fill:#475569}.a-default{fill:none;stroke:#64748b}.m-default{fill:#64748b}.semantic-sigil{fill:none;stroke:#475569;stroke-width:1.4}.sigil-fill{fill:#475569;stroke:none}.s-backend{stroke:#4f46e5}.s-frontend{stroke:#0284c7}.s-database{stroke:#059669}.flow-particle{fill:#0284c7;stroke:#fff;stroke-width:1.2}
@media(prefers-color-scheme:dark){svg{background:#0f172a}.c-mask{fill:#0f172a}.c-grid{stroke:#253247}.c-backend{fill:#202344;stroke:#a5b4fc}.c-frontend{fill:#0c3045;stroke:#38bdf8}.c-database{fill:#103c34;stroke:#34d399}.t-primary{fill:#f1f5f9}.t-muted{fill:#cbd5e1}.a-default{stroke:#94a3b8}.m-default{fill:#94a3b8}.flow-particle{fill:#38bdf8;stroke:#0f172a}}
@media(prefers-reduced-motion:reduce){.flow-particles{display:none}}@media print{.flow-particles{display:none}}
</style>
<!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

