name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # CHANGELOG.md luôn lấy từ main, kể cả khi tag trỏ vào commit cũ
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^(## \[|\[)/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Không tìm thấy mục [$version] trong CHANGELOG.md" >&2
            exit 1
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          echo "latest=$([ "$latest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SafeSight $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest=${{ steps.notes.outputs.latest }}
