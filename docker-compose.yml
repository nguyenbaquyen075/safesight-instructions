# Dashboard + YOLO Bridge từ image trên GHCR. AI engine (Python, model .pt) và agent chạy ngoài
# container: xem README mục "Chạy từ mã nguồn". Biến môi trường: chép .env.docker.example thành .env.
#
# ./data và ./public/snapshots dùng bind mount (không phải named volume) vì AI engine/agent chạy
# trên host cần đọc/ghi ĐÚNG file mà dashboard container thấy: engine mở thẳng dev.db (readonly) và
# ghi ảnh chụp vi phạm vào public/snapshots, dashboard phục vụ ảnh đó qua API. Host-side engine/agent
# phải chạy với DATABASE_URL=file:./data/dev.db (khớp bind mount ./data) và snapshot ghi vào cùng
# thư mục public/snapshots ở repo root.
services:
  dashboard:
    image: ghcr.io/nguyenbaquyen075/safesight-instructions/dashboard:latest
    build:
      context: .
      target: dashboard
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:./data/dev.db
      NEXT_PUBLIC_YOLO_SERVER_URL: ${NEXT_PUBLIC_YOLO_SERVER_URL:-http://localhost:4001}
      YOLO_BRIDGE_URL: http://bridge:4001
    volumes:
      - ./data:/app/data
      - ./public/snapshots:/app/public/snapshots
      - ./public/videos:/app/public/videos:ro
    depends_on:
      - bridge
    restart: unless-stopped

  bridge:
    image: ghcr.io/nguyenbaquyen075/safesight-instructions/bridge:latest
    build:
      context: .
      target: bridge
    ports:
      - "4001:4001"
    env_file: .env
    restart: unless-stopped
